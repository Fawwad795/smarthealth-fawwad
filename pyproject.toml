# Tool configuration. Deliberately no [project] table -- this is an
# application run from a container, not a distributable package.

[tool.ruff]
line-length = 88          # match black, so the two never disagree
target-version = "py311"

[tool.ruff.lint]
# E/F are ruff's defaults (pycodestyle errors, pyflakes). The rest are
# what this project has been told to enforce and previously checked only
# by eye:
#   D1xx  every module/class/method/function carries a docstring. Added
#         after a mentor review found 77 missing -- a linter catches that
#         in a second, a human review catches it a week later.
select = ["E", "F", "D100", "D101", "D102", "D103"]

# D203/D213 conflict with D211/D212 respectively; ruff warns unless one of
# each pair is disabled. These pick the "no blank line before class" and
# "summary on the first line" conventions, which is what the codebase does.
# E501 is left to black: it reflows code but will not split an unbreakable
# string, so enforcing it here only flags long messages black cannot fix.
ignore = ["D203", "D213", "E501"]

[tool.ruff.lint.per-file-ignores]
# Test functions are named as full sentences (test_duplicate_name_is_rejected)
# and fixtures are self-describing; a mandated docstring on each would be
# noise rather than information. Module-level docstrings are still required.
"tests/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
# Scoped to app/models only, not the whole app -- transcription typos on
# model attributes are this project's single biggest bug class per
# NOTES.md (book_at/booked_at was typed wrong twice on the same branch,
# caught by tests both times, never by review). app/models is the one
# layer that was already 100% clean against this check when it was
# trialled, so this is pure signal with no cleanup debt attached. The
# rest of app/ has real errors (mostly latent None-safety gaps) that are
# a separate, larger decision -- not folded in here.
files = ["app/models"]
python_version = "3.11"

[tool.pytest.ini_options]
# "auto" runs every `async def test_...` under its own event loop without a
# per-test @pytest.mark.asyncio decorator -- Temporal's client is async
# throughout, so every workflow/activity test would otherwise need one.
asyncio_mode = "auto"
# Pinned rather than left on pytest-asyncio's default: an async fixture
# (e.g. a shared WorkflowEnvironment) gets a fresh event loop per test,
# matching db_session's own per-test scope -- so a test can never see
# state left behind by the one that ran before it.
asyncio_default_fixture_loop_scope = "function"